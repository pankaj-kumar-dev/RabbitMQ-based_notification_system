version: '3.9'

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifications
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  db-migrate:
    build:
      context: .
      dockerfile: packages/producer/Dockerfile
    command: >
      sh -c "npx prisma db push --schema ./packages/producer/prisma/schema.prisma --accept-data-loss"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/notifications
    depends_on:
      postgres:
        condition: service_healthy

  producer:
    build:
      context: .
      dockerfile: packages/producer/Dockerfile
    container_name: producer
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/notifications
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_MGMT_URL: http://rabbitmq:15672
      PORT: "3000"
      NODE_ENV: production
      LOG_LEVEL: info
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  outbox-poller:
    build:
      context: .
      dockerfile: packages/outbox-poller/Dockerfile
    container_name: outbox-poller
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/notifications
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      NODE_ENV: production
      LOG_LEVEL: info
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: packages/consumer/Dockerfile
    container_name: consumer
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      LOG_LEVEL: info
      FAIL_MODE: "false"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rabbitmq_data:
  postgres_data:
  redis_data:
